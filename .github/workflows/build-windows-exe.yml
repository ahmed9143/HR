name: Build HR Enterprise Windows EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HR Enterprise.exe
    runs-on: windows-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller

      - name: Run tests
        shell: powershell
        continue-on-error: true
        run: |
          $tests = Get-ChildItem -Filter "TEST_*.py" -ErrorAction SilentlyContinue

          foreach ($test in $tests) {
            Write-Host "Running $($test.Name)"
            python $test.FullName
          }

      - name: Build HR Enterprise.exe
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "HR Enterprise" `
            --hidden-import win32clipboard `
            --hidden-import win32con `
            --collect-all reportlab `
            --add-data "fonts;fonts" `
            --add-data "data;data" `
            server.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Verify EXE
        shell: powershell
        run: |
          $exe = "dist\HR Enterprise.exe"

          if (!(Test-Path $exe)) {
            Write-Error "HR Enterprise.exe was not created."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "===================================="
          Write-Host "BUILD SUCCESSFUL"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $($file.Length) bytes"
          Write-Host "===================================="

      - name: Smoke test EXE
        shell: powershell
        continue-on-error: true
        run: |
          $exe = Resolve-Path "dist\HR Enterprise.exe"

          Write-Host "Starting HR Enterprise.exe..."

          $process = Start-Process `
            -FilePath $exe `
            -PassThru

          Start-Sleep -Seconds 10

          if ($process.HasExited) {
            Write-Warning "EXE exited during smoke test."
            Write-Warning "Exit code: $($process.ExitCode)"
          }
          else {
            Write-Host "HR Enterprise.exe is running successfully."
            Write-Host "PID: $($process.Id)"

            Stop-Process `
              -Id $process.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HR-Enterprise-Windows
          path: "dist/HR Enterprise.exe"
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: HR Enterprise - Latest Build
          prerelease: true
          body: |
            HR Enterprise Windows build.

            Download:
            HR Enterprise.exe
          files: "dist/HR Enterprise.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
