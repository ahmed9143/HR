name: Build HR Enterprise.exe (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build HR Enterprise.exe
        id: build
        continue-on-error: true
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "HR Enterprise" `
            --hidden-import win32clipboard `
            --hidden-import win32con `
            --collect-all reportlab `
            --add-data "fonts;fonts" `
            --add-data "data;data" `
            server.py *> build_log.txt
          "EXITCODE=$LASTEXITCODE" | Out-File -Append build_log.txt
          Get-Content build_log.txt

      - name: Publish build log to Issue #1 (for debugging)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/make_body.py << 'PYEOF'
import json, os, sys

log_path = "build_log.txt"
if os.path.exists(log_path):
    with open(log_path, "r", errors="replace") as f:
        log = f.read()[-60000:]
else:
    log = "(no build_log.txt file was produced)"

run_url = os.environ["RUN_URL"]
commit = os.environ["COMMIT_SHA"][:7]
text = "### Build attempt for commit {}\n\nRun: {}\n\n```\n{}\n```".format(commit, run_url, log)
with open("/tmp/comment_body.json", "w") as f:
    json.dump({"body": text}, f)
PYEOF
          python3 /tmp/make_body.py
          curl -s -X POST \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${REPO}/issues/1/comments" \
            -d @/tmp/comment_body.json

      - name: Always upload build log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Verify build output
        run: |
          if ("${{ steps.build.outcome }}" -ne "success") {
            Write-Error "PyInstaller build step failed. See ci-logs branch / build_log.txt"
            exit 1
          }
          if (!(Test-Path "dist\HR Enterprise.exe")) {
            Write-Error "Build failed: dist\HR Enterprise.exe was not created"
            exit 1
          }
          Write-Host "Build succeeded:"
          Get-Item "dist\HR Enterprise.exe" | Format-List

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HR-Enterprise-Windows
          path: dist/HR Enterprise.exe
          retention-days: 30

      - name: Create/refresh latest Release with the EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: HR Enterprise - Latest Build
          body: "Automated Windows build of HR Enterprise. Download HR Enterprise.exe below and double-click to run."
          files: dist/HR Enterprise.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
