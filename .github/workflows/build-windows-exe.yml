name: Build HR Enterprise.exe (Windows)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build HR Enterprise.exe
        id: build
        continue-on-error: true
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "HR Enterprise" `
            --hidden-import win32clipboard `
            --hidden-import win32con `
            --collect-all reportlab `
            --add-data "fonts;fonts" `
            --add-data "data;data" `
            server.py *> build_log.txt
          "EXITCODE=$LASTEXITCODE" | Out-File -Append build_log.txt
          Get-Content build_log.txt

      - name: Publish build log to repo (for debugging)
        if: always()
        shell: bash
        run: |
          git config user.email "ci@hr-enterprise.local"
          git config user.name "HR Enterprise CI"
          rm -rf /tmp/logrepo
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/logrepo
          cd /tmp/logrepo
          git checkout -B ci-logs
          cp "$GITHUB_WORKSPACE/build_log.txt" ./build_log.txt || echo "no log file" > build_log.txt
          git add build_log.txt
          git commit -m "CI build log [skip ci]" || echo "nothing to commit"
          git push -f origin ci-logs

      - name: Verify build output
        run: |
          if ("${{ steps.build.outcome }}" -ne "success") {
            Write-Error "PyInstaller build step failed. See ci-logs branch / build_log.txt"
            exit 1
          }
          if (!(Test-Path "dist\HR Enterprise.exe")) {
            Write-Error "Build failed: dist\HR Enterprise.exe was not created"
            exit 1
          }
          Write-Host "Build succeeded:"
          Get-Item "dist\HR Enterprise.exe" | Format-List

      - name: Upload EXE as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HR-Enterprise-Windows
          path: dist/HR Enterprise.exe
          retention-days: 30

      - name: Create/refresh latest Release with the EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: HR Enterprise - Latest Build
          body: "Automated Windows build of HR Enterprise. Download HR Enterprise.exe below and double-click to run."
          files: dist/HR Enterprise.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
